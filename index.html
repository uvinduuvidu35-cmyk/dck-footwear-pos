<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>
        * {

            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Background Photo Overlay */
            background: linear-gradient(rgba(13, 0, 26, 0.75), rgba(42, 0, 51, 0.85)), 
                        url('https://user35788.na.imgto.link/public/20260924/1000028595.avif') no-repeat center center fixed;

            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            text-align: center;
            padding: 20px;
        }

        /* Fireworks Canvas */
        #fireworksCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 50;
        }

        /* Music Floating Button */
        .music-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 51, 153, 0.75);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            color: #fff;
            padding: 12px 20px;
            border-radius: 30px;
            cursor: pointer;
            z-index: 100;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(255, 51, 153, 0.5);
            transition: 0.3s;
        }

        .music-btn:hover {
            background: rgba(255, 51, 153, 0.95);
            transform: scale(1.05);
        }

        .card-container {
            position: relative;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px 25px;
            border-radius: 25px;
            max-width: 480px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            z-index: 10;
        }

        /* Countdown Style */
        .countdown-title {
            font-size: 18px;
            color: #ff99dd;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }

        .timer-box {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .time-unit {
            background: rgba(255, 255, 255, 0.15);
            padding: 12px 14px;
            border-radius: 12px;
            min-width: 65px;
            border: 1px solid rgba(255, 105, 180, 0.4);
            backdrop-filter: blur(5px);
        }

        .time-unit span {
            display: block;
            font-size: 24px;
            font-weight: 600;
            color: #ff66cc;
            text-shadow: 0 0 10px rgba(255, 102, 204, 0.6);
        }

        .time-unit label {
            font-size: 10px;
            color: #e0e0e0;
            text-transform: uppercase;
        }

        /* Fireworks Wish Text */
        .fireworks-text {
            display: none;
            font-family: 'Dancing Script', cursive;
            font-size: 36px;
            color: #ff66cc;
            text-shadow: 0 0 20px #ff3399, 0 0 40px #ff99dd;
            animation: pulseText 1.5s infinite alternate;
        }

        .fireworks-subtext {
            font-size: 22px;
            color: #ffffff;
            margin-top: 10px;
            font-family: 'Poppins', sans-serif;
            text-shadow: 0 0 10px #ff3399;
        }

        @keyframes pulseText {
            0% { transform: scale(0.95); opacity: 0.8; }
            100% { transform: scale(1.08); opacity: 1; }
        }

        /* Go Section */
        .go-section {
            display: none;
            animation: fadeIn 1s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .photo-frame {
            width: 130px;
            height: 130px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(45deg, #ff3399, #ff99dd);
            box-shadow: 0 0 25px rgba(255, 51, 153, 0.8);
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

            border-radius: 40px;
            color: #fff;
