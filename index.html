<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Mage Menika ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Background Photo Overlay */
            background: linear-gradient(rgba(13, 0, 26, 0.75), rgba(42, 0, 51, 0.85)), 
                        url('https://user35788.na.imgto.link/public/20260924/1000028595.avif') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            text-align: center;
            padding: 20px;
        }

        /* Fireworks Canvas */
        #fireworksCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 50;
        }

        /* Music Floating Button */
        .music-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 51, 153, 0.75);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            color: #fff;
            padding: 12px 20px;
            border-radius: 30px;
            cursor: pointer;
            z-index: 100;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(255, 51, 153, 0.5);
            transition: 0.3s;
        }

        .music-btn:hover {
            background: rgba(255, 51, 153, 0.95);
            transform: scale(1.05);
        }

        .card-container {
            position: relative;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px 25px;
            border-radius: 25px;
            max-width: 480px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            z-index: 10;
        }

        /* Countdown Style */
        .countdown-title {
            font-size: 18px;
            color: #ff99dd;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }

        .timer-box {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .time-unit {
            background: rgba(255, 255, 255, 0.15);
            padding: 12px 14px;
            border-radius: 12px;
            min-width: 65px;
            border: 1px solid rgba(255, 105, 180, 0.4);
            backdrop-filter: blur(5px);
        }

        .time-unit span {
            display: block;
            font-size: 24px;
            font-weight: 600;
            color: #ff66cc;
            text-shadow: 0 0 10px rgba(255, 102, 204, 0.6);
        }

        .time-unit label {
            font-size: 10px;
            color: #e0e0e0;
            text-transform: uppercase;
        }

        /* Fireworks Wish Text */
        .fireworks-text {
            display: none;
            font-family: 'Dancing Script', cursive;
            font-size: 38px;
            color: #ff66cc;
            text-shadow: 0 0 20px #ff3399, 0 0 40px #ff99dd;
            animation: pulseText 1.5s infinite alternate;
        }

        @keyframes pulseText {
            0% { transform: scale(0.95); opacity: 0.8; }
            100% { transform: scale(1.08); opacity: 1; }
        }

        /* Go Section */
        .go-section {
            display: none;
            animation: fadeIn 1s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .photo-frame {
            width: 130px;
            height: 130px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(45deg, #ff3399, #ff99dd);
            box-shadow: 0 0 25px rgba(255, 51, 153, 0.8);
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .btn-go {
            padding: 15px 40px;
            background: linear-gradient(90deg, #ff3399, #ff66cc);
            border: none;
            border-radius: 40px;
            color: #fff;
            font-size: 22px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 51, 153, 0.8);
            transition: 0.3s;
            letter-spacing: 2px;
            margin-top: 15px;
        }

        .btn-go:hover {
            transform: scale(1.1);
            box-shadow: 0 0 35px rgba(255, 102, 204, 1);
        }

        .heart {
            position: absolute;
            bottom: -50px;
            font-size: 20px;
            color: #ff3399;
            animation: floatUp 6s linear infinite;
            opacity: 0.7;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body onclick="enableAudioOnFirstClick()">

    <canvas id="fireworksCanvas"></canvas>

    <!-- Background Music -->
    <audio id="bgMusic" loop preload="auto">
        <source src="https://cdn.pixabay.com/download/audio/2021/08/09/audio_276063b78c.mp3?filename=happy-birthday-155461.mp3" type="audio/mpeg">
    </audio>

    <button class="music-btn" onclick="toggleMusic(event)">
        🎵 <span id="musicText">Play Music</span>
    </button>

    <!-- Floating Background Hearts -->
    <div class="heart" style="left: 10%; animation-delay: 0s;">💖</div>
    <div class="heart" style="left: 25%; animation-delay: 2s;">❤️</div>
    <div class="heart" style="left: 45%; animation-delay: 4s;">💕</div>
    <div class="heart" style="left: 70%; animation-delay: 1s;">💖</div>
    <div class="heart" style="left: 85%; animation-delay: 3s;">✨</div>

    <div class="card-container">
        <!-- 1. Countdown Section -->
        <div id="countdownSection">
            <div style="font-size: 60px; margin-bottom: 10px;">🎂</div>
            <div class="countdown-title">Counting down to your special day... ❤️</div>
            <div class="timer-box">
                <div class="time-unit"><span id="days">00</span><label>Days</label></div>
                <div class="time-unit"><span id="hours">00</span><label>Hours</label></div>
                <div class="time-unit"><span id="minutes">00</span><label>Mins</label></div>
                <div class="time-unit"><span id="seconds">00</span><label>Secs</label></div>
            </div>
            <p style="font-size: 12px; color: #ffb3ec;">(2007.09.25 - Special Day)</p>
        </div>

        <!-- 2. Fireworks Text Section (Shows during 20s Fireworks) -->
        <div id="fireworksTextSection" class="fireworks-text">
            ❤️ Love Mage Menika ❤️
        </div>

        <!-- 3. Go Button Section (Appears after 20s Fireworks) -->
        <div id="goSection" class="go-section">
            <div class="photo-frame">
                <img src="https://user35788.na.imgto.link/public/20260924/1000028595.avif" alt="Mage Menika">
            </div>
            <h2 style="font-family: 'Dancing Script', cursive; font-size: 32px; color: #ff99dd; margin-bottom: 15px;">
                Happy Birthday Mage Menika ❤️
            </h2>
            <button class="btn-go" onclick="goToLetter()">GO 💌</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script>
        const music = document.getElementById("bgMusic");
        const musicText = document.getElementById("musicText");
        let hasPlayedOnce = false;

        function toggleMusic(e) {
            if(e) e.stopPropagation();
            if (music.paused) {
                music.play().then(() => {
                    musicText.innerText = "Pause Music";
                }).catch(() => {});
            } else {
                music.pause();
                musicText.innerText = "Play Music";
            }
        }

        function enableAudioOnFirstClick() {
            if (!hasPlayedOnce) {
                music.play().then(() => {
                    musicText.innerText = "Pause Music";
                    hasPlayedOnce = true;
                }).catch(() => {});
            }
        }

        function getNextBirthday() {
            const now = new Date();
            let currentYear = now.getFullYear();
            let target = new Date(currentYear, 8, 25, 0, 0, 0);

            if (now > target) {
                target = new Date(currentYear + 1, 8, 25, 0, 0, 0);
            }
            return target;
        }

        const targetDate = getNextBirthday();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate.getTime() - now;

            if (difference <= 0) {
                startFireworksPhase();
                return;
            }

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById('days').innerText = days < 10 ? '0' + days : days;
            document.getElementById('hours').innerText = hours < 10 ? '0' + hours : hours;
            document.getElementById('minutes').innerText = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById('seconds').innerText = seconds < 10 ? '0' + seconds : seconds;
        }

        let countdownInterval = setInterval(updateCountdown, 1000);

        // Phase 2: Fireworks for 20 Seconds with Text
        function startFireworksPhase() {
            clearInterval(countdownInterval);
            document.getElementById('countdownSection').style.display = 'none';
            document.getElementById('fireworksTextSection').style.display = 'block';

            music.play().catch(() => {});
            musicText.innerText = "Pause Music";

            var duration = 20 * 1000; // 20 Seconds
            var end = Date.now() + duration;

            var interval = setInterval(function() {
                if (Date.now() > end) {
                    clearInterval(interval);
                    showGoButton();
                    return;
                }

                confetti({
                    startVelocity: 30,
                    spread: 360,
                    ticks: 60,
                    origin: { x: Math.random(), y: Math.random() - 0.2 }
                });
            }, 250);
        }

        // Phase 3: Show GO Button to Navigate to letter.html
        function showGoButton() {
            document.getElementById('fireworksTextSection').style.display = 'none';
            document.getElementById('goSection').style.display = 'block';
        }

        function goToLetter() {
            window.location.href = 'letter.html';
        }

        updateCountdown();
    </script>
</body>
</html>
`
