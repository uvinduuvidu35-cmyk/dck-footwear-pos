<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Love Letter 💌</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(rgba(15, 0, 30, 0.75), rgba(45, 0, 55, 0.85)), 
                        url('https://user35788.na.imgto.link/public/20260924/1000028595.avif') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            padding: 20px;
        }

        /* Fireworks Canvas */
        #fireworksCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 5;
        }

        /* Floating Hearts Background */
        .heart {
            position: fixed;
            bottom: -50px;
            font-size: 22px;
            color: #ff3399;
            animation: floatUp 7s linear infinite;
            opacity: 0.6;
            z-index: 1;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }

        /* Music Button */
        .music-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 51, 153, 0.75);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            color: #fff;
            padding: 10px 18px;
            border-radius: 30px;
            cursor: pointer;
            z-index: 100;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(255, 51, 153, 0.5);
            transition: 0.3s;
        }

        .music-btn:hover {
            background: rgba(255, 51, 153, 0.95);
            transform: scale(1.05);
        }

        /* Letter Container */
        .letter-container {
            position: relative;
            background: rgba(20, 0, 30, 0.65);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1.5px solid rgba(255, 102, 204, 0.3);
            padding: 35px 25px;
            border-radius: 25px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(255, 51, 153, 0.2);
            z-index: 10;
        }

        .letter-header {
            text-align: center;
            font-family: 'Dancing Script', cursive;
            font-size: 36px;
            color: #ff99dd;
            margin-bottom: 20px;
            text-shadow: 0 0 15px rgba(255, 51, 153, 0.6);
        }

        /* Typing Text Area */
        .typed-text {
            font-size: 16px;
            line-height: 1.8;
            color: #fff0f8;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
            white-space: pre-wrap;
            min-height: 220px;
        }

        /* Cursor Effect */
        .cursor {
            display: inline-block;
            width: 3px;
            background-color: #ff66cc;
            margin-left: 2px;
            animation: blink 0.7s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Back Button */
        .btn-back {
            display: none;
            margin: 25px auto 0 auto;
            padding: 10px 25px;
            background: linear-gradient(90deg, #ff3399, #ff66cc);
            border: none;
            border-radius: 30px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 51, 153, 0.5);
            transition: 0.3s;
            text-align: center;
        }

        .btn-back:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 51, 153, 0.8);
        }
    </style>
</head>
<body onclick="enableAudioOnFirstClick()">

    <!-- Canvas for Fireworks -->
    <canvas id="fireworksCanvas"></canvas>

    <!-- Audio -->
    <audio id="bgMusic" loop preload="auto">
        <source src="https://cdn.pixabay.com/download/audio/2021/08/09/audio_276063b78c.mp3?filename=happy-birthday-155461.mp3" type="audio/mpeg">
    </audio>

    <button class="music-btn" onclick="toggleMusic(event)">
        🎵 <span id="musicText">Pause Music</span>
    </button>

    <!-- Hearts -->
    <div class="heart" style="left: 10%; animation-delay: 0s;">💖</div>
    <div class="heart" style="left: 30%; animation-delay: 2.5s;">❤️</div>
    <div class="heart" style="left: 55%; animation-delay: 4s;">💕</div>
    <div class="heart" style="left: 75%; animation-delay: 1s;">✨</div>
    <div class="heart" style="left: 90%; animation-delay: 3s;">💖</div>

    <div class="letter-container">
        <div class="letter-header">A Letter From My Heart 💌</div>
        
        <!-- Typing Area -->
        <div class="typed-text"><span id="textHolder"></span><span class="cursor" id="cursor"></span></div>

        <!-- Back Button -->
        <button id="backBtn" class="btn-back" onclick="goBack()">⬅️ Back to Home</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script>
        // ඔයා කියපු ලියුමේ සිංහල ටෙස්ට් එක
        const letterText = "මගේ මැණික වෙත,\n\nආදරෙයි මගේ පැටියෝ, හැමදාම ඔයා සතුටින් පරිස්සමෙන් අම්මා තාත්තා බලාගෙන ආදරෙන් ඉන්න. මම ඔයාට හැමදාම ඉන්නවා. අයියා ඔයත් එක්ක මැරෙනකම්ම ජීවත් වෙනවා.\n\nමම ආදරෙයි මගේ පැටියට! 💖✨";

        const textHolder = document.getElementById("textHolder");
        const cursor = document.getElementById("cursor");
        const backBtn = document.getElementById("backBtn");
        const music = document.getElementById("bgMusic");
        const musicText = document.getElementById("musicText");

        let index = 0;
        let hasPlayedOnce = false;

        // Fireworks Script Setup
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.radius = Math.random() * 3 + 1.5;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.01;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.05; // Gravity
                this.alpha -= this.decay;
            }
        }

        function createFirework(x, y) {
            const colors = ['#ff3399', '#ff99dd', '#ffcc00', '#00ffff', '#ff5050', '#ffffff', '#e60073'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            const count = 40 + Math.floor(Math.random() * 25);
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function animateFireworks() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            if (Math.random() < 0.12) { // Frequency of fireworks
                const rx = Math.random() * canvas.width;
                const ry = Math.random() * (canvas.height * 0.7);
                createFirework(rx, ry);
            }

            requestAnimationFrame(animateFireworks);
        }

        // Auto Music Play and Animations on Page Load
        window.addEventListener('DOMContentLoaded', () => {
            music.play().then(() => {
                hasPlayedOnce = true;
                musicText.innerText = "Pause Music";
            }).catch(() => {
                musicText.innerText = "Play Music";
            });
            startTyping();
            animateFireworks();
            startConfetti();
        });

        function startConfetti() {
            setInterval(() => {
                confetti({
                    startVelocity: 25,
                    spread: 360,
                    ticks: 50,
                    origin: { x: Math.random(), y: Math.random() - 0.2 }
                });
            }, 400);
        }

        function enableAudioOnFirstClick() {
            if (!hasPlayedOnce) {
                music.play().then(() => {
                    musicText.innerText = "Pause Music";
                    hasPlayedOnce = true;
                }).catch(() => {});
            }
        }

        function toggleMusic(e) {
            e.stopPropagation();
            if (music.paused) {
                music.play().then(() => {
                    musicText.innerText = "Pause Music";
                }).catch(() => {});
            } else {
                music.pause();
                musicText.innerText = "Play Music";
            }
        }

        // Auto Typewriter Function
        function startTyping() {
            if (index < letterText.length) {
                textHolder.textContent += letterText.charAt(index);
                index++;
                setTimeout(startTyping, 90); // Typing Speed (Milliseconds)
            } else {
                cursor.style.display = 'none'; // Typing ඉවර වූ පසු Cursor එක අයින් කරයි
                backBtn.style.display = 'block'; // Back button එක පෙන්වයි
            }
        }

        function goBack() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
