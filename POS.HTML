<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Terminal - POS System</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', Arial, sans-serif;
        }

        body { 
            display: flex; 
            background-color: #f4f6f9; 
            color: #333;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Styling */
        .sidebar { 
            width: 260px; 
            background-color: #1a1c23; 
            color: white; 
            height: 100vh; 
            padding: 20px 15px; 
            position: fixed; 
            overflow-y: auto;
        }

        .sidebar h2 { 
            text-align: center; 
            color: #ffffff; 
            margin-bottom: 30px; 
            font-size: 22px;
            letter-spacing: 1px;
        }

        .sidebar ul { list-style: none; padding: 0; }
        .sidebar li { margin: 8px 0; }

        .sidebar a { 
            color: #a0a5b5; 
            text-decoration: none; 
            display: flex; 
            align-items: center; 
            gap: 12px;
            padding: 12px 15px; 
            border-radius: 8px; 
            font-size: 14px;
            transition: all 0.3s ease; 
        }

        .sidebar a i { font-size: 16px; width: 20px; text-align: center; }

        .sidebar a:hover, .sidebar a.active { 
            background: linear-gradient(90deg, #ff7d32, #4a0000); 
            color: white; 
        }

        /* POS Terminal Content */
        .pos-container { 
            margin-left: 260px; 
            display: grid;
            grid-template-columns: 1fr 420px;
            width: calc(100% - 260px); 
            height: 100vh;
        }

        /* Left Section: Search & Product Catalog */
        .products-section {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        .search-bar-container {
            display: flex;
            gap: 10px;
        }

        .search-input-wrap {
            position: relative;
            flex: 1;
        }

        .search-input-wrap i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
        }

        .search-input {
            width: 100%;
            padding: 14px 14px 14px 45px;
            border-radius: 10px;
            border: 1px solid #ddd;
            font-size: 15px;
            outline: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .search-input:focus {
            border-color: #ff7d32;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
        }

        .product-card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            cursor: pointer;
            text-align: center;
            border: 1px solid #eee;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.08);
            border-color: #ff7d32;
        }

        .product-card h4 {
            font-size: 14px;
            margin-bottom: 5px;
            color: #1a1c23;
        }

        .product-card .price {
            color: #ff7d32;
            font-weight: bold;
            font-size: 15px;
        }

        .product-card .code {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
        }

        /* Right Section: Cart / Billing */
        .cart-section {
            background: white;
            border-left: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: -4px 0 10px rgba(0,0,0,0.02);
        }

        .cart-header {
            padding: 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 15px 20px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .cart-item-info h5 {
            font-size: 14px;
            color: #1a1c23;
        }

        .cart-item-info span {
            font-size: 12px;
            color: #777;
        }

        .cart-item-qty {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .qty-btn {
            background: #eee;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .qty-btn:hover {
            background: #ff7d32;
            color: white;
        }

        .cart-summary {
            padding: 20px;
            background: #fdfdfd;
            border-top: 1px solid #eee;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
            color: #666;
        }

        .summary-row.total {
            font-size: 18px;
            font-weight: bold;
            color: #1a1c23;
            border-top: 1px dashed #ccc;
            padding-top: 10px;
            margin-top: 10px;
        }

        .btn-pay {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #ff7d32, #4a0000);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: opacity 0.2s;
        }

        .btn-pay:hover {
            opacity: 0.9;
        }

        /* Modal Overlay for Payment & Receipt */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 12px;
            width: 350px;
            text-align: center;
        }

        .modal-content input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            font-size: 18px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        /* Thermal Printable Receipt Styles */
        @media print {
            body * { visibility: hidden; }
            #printable-receipt, #printable-receipt * { visibility: visible; }
            #printable-receipt {
                position: absolute;
                left: 0; top: 0;
                width: 80mm;
                font-family: monospace;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- Sidebar with Full Menu -->
    <div class="sidebar">
        <h2>DCK POS</h2>
        <ul>
            <li><a href="dck dassh.html"><i class="fa-solid fa-gauge"></i> Dashboard</a></li>
            <li><a href="POS.HTML" class="active"><i class="fa-solid fa-cart-shopping"></i> POS</a></li>
            <li><a href="items.html"><i class="fa-solid fa-boxes-stacked"></i> Items</a></li>
            <li><a href="Customer.html"><i class="fa-solid fa-users"></i> Customers</a></li>
            <li><a href="chat.html"><i class="fa-solid fa-comments"></i> Chat</a></li>
            <li><a href="index.html"><i class="fa-solid fa-right-from-bracket"></i> Login / Home</a></li>
        </ul>
    </div>

    <!-- POS Terminal Main Section -->
    <div class="pos-container">

        <!-- Left: Product Search and Items -->
        <div class="products-section">
            <div class="search-bar-container">
                <div class="search-input-wrap">
                    <i class="fa-solid fa-barcode"></i>
                    <input type="text" id="barcode-input" class="search-input" placeholder="Scan Barcode / QR or type product name/code & press Enter..." autofocus>
                </div>
            </div>

            <div class="product-grid" id="product-grid">
                <!-- Products dynamically rendered from Firebase -->
                <p style="grid-column: 1/-1; text-align: center; color: #888;">Loading items...</p>
            </div>
        </div>

        <!-- Right: Current Cart / Checkout -->
        <div class="cart-section">
            <div class="cart-header">
                <h3><i class="fa-solid fa-cart-shopping"></i> Current Order</h3>
                <button id="btn-clear-cart" style="background:none; border:none; color:#e74c3c; cursor:pointer;"><i class="fa-solid fa-trash"></i> Clear</button>
            </div>

            <div class="cart-items" id="cart-items">
                <!-- Cart Items will appear here -->
            </div>

            <div class="cart-summary">
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="subtotal-val">LKR 0.00</span>
                </div>
                <div class="summary-row">
                    <span>Tax (0%)</span>
                    <span>LKR 0.00</span>
                </div>
                <div class="summary-row total">
                    <span>Total</span>
                    <span id="total-val">LKR 0.00</span>
                </div>
                <button class="btn-pay" id="btn-open-modal"><i class="fa-solid fa-print"></i> PAY & PRINT (Enter)</button>
            </div>
        </div>
    </div>

    <!-- Payment & Auto-Print Modal -->
    <div class="modal" id="payment-modal">
        <div class="modal-content">
            <h3>Complete Payment</h3>
            <p>Total Due: <strong id="modal-total">LKR 0.00</strong></p>
            <input type="number" id="cash-given" placeholder="Enter Cash Amount" autofocus>
            <button class="btn-pay" id="btn-process-checkout"><i class="fa-solid fa-check"></i> Print Receipt & Complete</button>
        </div>
    </div>

    <!-- Hidden Printable Receipt Area -->
    <div id="printable-receipt" style="display:none;">
        <h3 style="text-align:center;">DCK FOOTWEAR POS</h3>
        <p style="text-align:center;">Main Store</p>
        <hr>
        <div id="receipt-body"></div>
        <hr>
        <p style="text-align:center;">Thank You! Come Again!</p>
    </div>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC3xvmy4iXZ7B0ZbVjP2-ZoFuDcacg71F4",
            authDomain: "dck-29351.firebaseapp.com",
            projectId: "dck-29351",
            storageBucket: "dck-29351.firebasestorage.app",
            messagingSenderId: "577984877543",
            appId: "1:577984877543:web:91f6a221eb4f7c85a2e342",
            measurementId: "G-6YETC20HD3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let productsDB = [];
        let cart = [];

        // 1. Fetch Realtime Products from Firestore "items" collection
        const itemsRef = collection(db, "items");
        onSnapshot(itemsRef, (snapshot) => {
            productsDB = [];
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';

            if (snapshot.empty) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #888;">No products found in Firestore.</p>';
                return;
            }

            snapshot.docs.forEach(doc => {
                const data = doc.data();
                const item = {
                    id: doc.id,
                    code: data.code || doc.id.substring(0, 6).toUpperCase(),
                    name: data.name || 'Unnamed Item',
                    price: Number(data.price) || 0
                };
                productsDB.push(item);

                const card = document.createElement('div');
                card.className = 'product-card';
                card.onclick = () => addToCart(item.code, item.name, item.price);
                card.innerHTML = `
                    <h4>${item.name}</h4>
                    <div class="price">LKR ${item.price.toFixed(2)}</div>
                    <div class="code">Code: ${item.code}</div>
                `;
                grid.appendChild(card);
            });
        });

        // 2. Cart Functions
        window.addToCart = function(code, name, price) {
            let existing = cart.find(item => item.code === code);
            if (existing) {
                existing.qty++;
            } else {
                cart.push({ code, name, price, qty: 1 });
            }
            renderCart();
        };

        function renderCart() {
            const container = document.getElementById('cart-items');
            container.innerHTML = '';
            let total = 0;

            cart.forEach((item, index) => {
                let itemTotal = item.price * item.qty;
                total += itemTotal;

                container.innerHTML += `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <h5>${item.name}</h5>
                            <span>LKR ${item.price.toFixed(2)} x ${item.qty}</span>
                        </div>
                        <div class="cart-item-qty">
                            <button class="qty-btn" onclick="updateQty(${index}, -1)">-</button>
                            <span>${item.qty}</span>
                            <button class="qty-btn" onclick="updateQty(${index}, 1)">+</button>
                        </div>
                    </div>
                `;
            });

            document.getElementById('subtotal-val').innerText = `LKR ${total.toFixed(2)}`;
            document.getElementById('total-val').innerText = `LKR ${total.toFixed(2)}`;
            document.getElementById('modal-total').innerText = `LKR ${total.toFixed(2)}`;
        }

        window.updateQty = function(index, change) {
            cart[index].qty += change;
            if (cart[index].qty <= 0) cart.splice(index, 1);
            renderCart();
        };

        function clearCart() {
            cart = [];
            renderCart();
        }
        document.getElementById('btn-clear-cart').addEventListener('click', clearCart);

        // 3. Search & Barcode Logic
        document.getElementById('barcode-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                let val = this.value.trim().toLowerCase();
                let found = productsDB.find(p => p.code.toLowerCase() === val || p.name.toLowerCase().includes(val));
                if (found) {
                    addToCart(found.code, found.name, found.price);
                    this.value = '';
                } else {
                    alert('Product not found in Database!');
                }
            }
        });

        // 4. Modal Handlers
        document.getElementById('btn-open-modal').addEventListener('click', () => {
            if (cart.length === 0) return alert('Cart is empty!');
            document.getElementById('payment-modal').style.display = 'flex';
            document.getElementById('cash-given').focus();
        });

        // 5. Checkout & Add Order to Firebase "orders" collection
        async function processCheckout() {
            if (cart.length === 0) return;

            let total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            let cashGiven = Number(document.getElementById('cash-given').value) || total;
            let change = cashGiven - total;

            const now = new Date();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const invoiceNo = 'INV-' + Date.now().toString().slice(-6);

            // Firestore Object Creation
            const orderData = {
                invoiceNo: invoiceNo,
                totalAmount: total,
                cashGiven: cashGiven,
                change: change,
                items: cart,
                status: "Completed",
                time: timeStr,
                createdAt: now
            };

            try {
                // Save Order to Firebase Database
                await addDoc(collection(db, "orders"), orderData);

                // Print Receipt Logic
                let receiptContent = `<p>Invoice: ${invoiceNo}</p><p>Time: ${timeStr}</p><hr>`;
                cart.forEach(item => {
                    let itemTotal = item.price * item.qty;
                    receiptContent += `<p>${item.name} x ${item.qty} = LKR ${itemTotal.toFixed(2)}</p>`;
                });
                receiptContent += `<h4>TOTAL: LKR ${total.toFixed(2)}</h4>`;
                receiptContent += `<p>Cash Paid: LKR ${cashGiven.toFixed(2)}</p>`;
                receiptContent += `<p>Change: LKR ${change.toFixed(2)}</p>`;
                
                document.getElementById('receipt-body').innerHTML = receiptContent;
                document.getElementById('printable-receipt').style.display = 'block';
                window.print();
                document.getElementById('printable-receipt').style.display = 'none';

                // Cleanup UI
                document.getElementById('payment-modal').style.display = 'none';
                document.getElementById('cash-given').value = '';
                clearCart();
                document.getElementById('barcode-input').focus();

            } catch (error) {
                console.error("Error saving order: ", error);
                alert("Order failed to save in Firebase: " + error.message);
            }
        }

        document.getElementById('btn-process-checkout').addEventListener('click', processCheckout);

        document.getElementById('cash-given').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                processCheckout();
            }
        });
    </script>
</body>
</html>
